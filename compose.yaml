---
services:
  minio-proxy:
    container_name: ${PROJECT_NAME}_proxy
    image: nginx:1.27-alpine
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      # API
      - traefik.http.routers.minio-api.tls=true
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.rule=Host(`${API_URL}`)
      - traefik.http.routers.minio-api.service=minio-api-loadbalancer
      - traefik.http.services.minio-api-loadbalancer.loadbalancer.server.port=9000
      # Console
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.rule=Host(`${CONSOLE_HOST}`)
      - traefik.http.routers.minio-console.service=minio-console-loadbalancer
      - traefik.http.services.minio-console-loadbalancer.loadbalancer.server.port=9001
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - traefik-network
      - minio-internal

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: ${PROJECT_NAME}
    command: server --console-address ":9001" /data/minio/ --license /minio.license
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
      - ./.docker/minio.license:/minio.license:ro
    networks:
      - minio-internal

volumes:
  minio_data:

networks:
  minio-internal:
  traefik-network:
    external: true
    name: ${TRAEFIK_NETWORK}
